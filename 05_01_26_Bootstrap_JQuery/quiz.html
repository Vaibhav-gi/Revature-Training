<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Quiz Portal</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: linear-gradient(120deg, #89f7fe, #66a6ff);
  padding: 20px;
}

/* CENTER CONTAINER */
.quiz-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: auto;
}

/* QUIZ AREA */
.quiz-box {
  flex: 3;
  background: white;
  padding: 25px;
  border-radius: 10px;
  min-width: 300px;
}

.palette {
  flex: 1;
  background: white;
  padding: 20px;
  border-radius: 10px;
  min-width: 220px;
}

/* QUESTION */
.question {
  font-size: 22px;
  margin-bottom: 20px;
}

.option {
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 8px;
  background: #f0f0f0;
  border: 2px solid #ccc;
  cursor: pointer;
}

.option.selected {
  background: #0d6efd;
  color: white;
}

/* CONTROLS */
.controls {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
}

button {
  padding: 10px 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

#previousBtn, #nextBtn { background: green; color: white; }
#reviewBtn { background: #0d6efd; color: white; }

/* TIMER + PROGRESS */
.timer {
  text-align: right;
  font-weight: bold;
}

.progress {
  height: 18px;
  background: #ddd;
  border-radius: 10px;
  margin: 15px 0;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(to right, #00c853, #64dd17);
  border-radius: 10px;
  width: 0%;
}

/* PALETTE */
.p-box {
  width: 40px;
  height: 40px;
  margin: 6px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.not-answered { background: #555; color: white; }
.answered { background: green; color: white; }
.review { background: #0d6efd; color: white; }

.legend {
  margin-top: 15px;
  font-size: 14px;
}

.legend div {
  display: flex;
  align-items: center;
  margin-bottom: 6px;
}

.legend-box {
  width: 14px;
  height: 14px;
  margin-right: 8px;
  border-radius: 3px;
}

/* LOGIN PAGE CENTERING */
.login-wrapper {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* LOGIN CARD */
.login-card {
  background: white;
  padding: 35px;
  width: 320px;
  text-align: center;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

/* ICON */
.login-icon {
  font-size: 60px;
  color: #0d6efd;
  margin-bottom: 10px;
}

.login-card h2 {
  margin-bottom: 5px;
}

.login-card p {
  color: #666;
  font-size: 14px;
  margin-bottom: 20px;
}

/* INPUT */
.login-card input {
  width: 100%;
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

/* BUTTON */
.login-card button {
  width: 100%;
  padding: 10px;
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
}

.login-card button:hover {
  background: #084298;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-wrapper">
  <div class="login-card">
    <i class="bi bi-person-circle login-icon"></i>
    <h2>Welcome to Quiz Portal</h2>
    <p>Please enter your name to start</p>

    <input type="text" id="username" placeholder="Enter your name">
    <button id="startTest">Start Test</button>
  </div>
</div>

<!-- QUIZ PAGE -->
<div id="quizPage" style="display:none;">

  <div class="quiz-container">

    <!-- QUIZ -->
    <div class="quiz-box">
      <div class="timer"><i class="bi bi-clock-fill"></i> <span id="time">10:00</span></div>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

      <div class="question"></div>
      <div class="options"></div>

      <div class="controls">
        <button id="previousBtn">Previous</button>
        <button id="reviewBtn">Review</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>

    <!-- PALETTE -->
    <div class="palette">
      <h4>Questions</h4>
      <div id="paletteBox"></div>

      <div class="legend">
        <div><span class="legend-box answered"></span> Answered</div>
        <div><span class="legend-box review"></span> Review</div>
        <div><span class="legend-box not-answered"></span> Not Answered</div>
      </div>
    </div>

  </div>
</div>

<script>
const quiz = [
  { q:"HTML stands for?", o:["Hyper Text Markup Language","High Text","Home Tool","Hyperlink"], a:0 },
  { q:"CSS is used for?", o:["Logic","Styling","Database","Server"], a:1 },
  { q:"JavaScript is?", o:["Compiled","Interpreted","Assembly","Machine"], a:1 },
  { q:"ID selector symbol?", o:[".","#","*","@"], a:1 },
  { q:"JS library?", o:["HTML","CSS","jQuery","SQL"], a:2 },
  { q:"Block scope variable?", o:["var","let","const","static"], a:1 },
  { q:"Add element to array?", o:["push()","pop()","shift()","unshift()"], a:0 },
  { q:"Click handler in jQuery?", o:["onClick()","click()","press()","hover()"], a:1 },
  { q:"HTML link tag?", o:["&lt;a&gt;","&lt;link&gt;","&lt;href&gt;","&lt;url&gt;"], a:0 },
  { q:"CSS text color?", o:["font","bg","color","align"], a:2 }
];

let index=0, score=0, time=600;
let answers = Array(quiz.length).fill(null);

/* INIT */
quiz.forEach((_,i)=>{
  $("#paletteBox").append(`<div class="p-box not-answered" data-i="${i}">${i+1}</div>`);
});

function loadQuestion(){
  $(".question").text(`Q${index+1}. ${quiz[index].q}`);
  $(".options").empty();

  quiz[index].o.forEach((opt,i)=>{
    $(".options").append(`<div class="option ${answers[index]===i?'selected':''}" data-i="${i}">${opt}</div>`);
  });

  $(".progress-bar").css("width",(index/quiz.length)*100+"%");
  $("#previousBtn").prop("disabled", index===0);
  $("#nextBtn").text(index===quiz.length-1?"Submit":"Next");
}

$(document).on("click",".option",function(){
  $(".option").removeClass("selected");
  $(this).addClass("selected");
  answers[index]=Number($(this).data("i"));
  $(`.p-box[data-i=${index}]`).removeClass("not-answered").addClass("answered");
});

$("#previousBtn").click(()=>{ if(index>0){index--; loadQuestion();}});
$("#reviewBtn").click(()=>{$(`.p-box[data-i=${index}]`).removeClass("answered").addClass("review");});
$("#nextBtn").click(()=>{ index<quiz.length-1?index++&&loadQuestion():finishQuiz();});
$(document).on("click",".p-box",e=>{index=$(e.target).data("i"); loadQuestion();});

setInterval(()=>{
  time--;
  let m=Math.floor(time/60), s=time%60;
  $("#time").text(`${m}:${s<10?'0':''}${s}`);
},1000);

function finishQuiz() {
  score = answers.filter((a, i) => a === quiz[i].a).length;

  let resultText = "";
  let iconClass = "";
  let image = "";

  if (score >= 8) {
    resultText = "Excellent!";
    iconClass = "bi-emoji-laughing-fill";
    image = "excellent.png";
  } else if (score >= 4) {
    resultText = "Good Job!";
    iconClass = "bi-emoji-smile-fill";
    image = "good.png";
  } else {
    resultText = "Average – Try Again!";
    iconClass = "bi-emoji-neutral-fill";
    image = "average.webp";
  }

  $(".quiz-box").html(`
    <div class="text-center">
      <h2><i class="bi ${iconClass}"></i> ${resultText}</h2>
      <h3>Score: ${score}/${quiz.length}</h3>
      <img src="${image}" width="150" style="margin:15px 0;"><br>

      <button id="reviewResult">Review Answers</button>
      <button id="retryBtn">Try Again</button>

      <div id="reviewSection"></div>
    </div>
  `);
}

$("#startTest").click(()=>{
  if(!$("#username").val()) return alert("Enter name");
  $("#loginPage").hide();
  $("#quizPage").show();
  loadQuestion();
});
</script>

</body>
</html>
