<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Grid Examples</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    .box {
      height: 80px;
      color: white;
      border: 1px solid black;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }


  </style>
</head>
<body>

<div class="container mt-4">

  <h4>12 Columns × 2 Rows</h4>

  <!-- ROW 1 -->
  <div class="row">
    <div class="col-1 box bg-primary">1</div>
    <div class="col-1 box bg-secondary">2</div>
    <div class="col-1 box bg-success">3</div>
    <div class="col-1 box bg-danger">4</div>
    <div class="col-1 box bg-warning">5</div>
    <div class="col-1 box bg-info">6</div>
    <div class="col-1 box bg-dark">7</div>
    <div class="col-1 box bg-primary">8</div>
    <div class="col-1 box bg-secondary">9</div>
    <div class="col-1 box bg-success">10</div>
    <div class="col-1 box bg-danger">11</div>
    <div class="col-1 box bg-warning">12</div>
  </div>

  <!-- ROW 2 -->
  <div class="row mt-2">
    <div class="col-1 box bg-info">1</div>
    <div class="col-1 box bg-dark">2</div>
    <div class="col-1 box bg-primary">3</div>
    <div class="col-1 box bg-secondary">4</div>
    <div class="col-1 box bg-success">5</div>
    <div class="col-1 box bg-danger">6</div>
    <div class="col-1 box bg-warning">7</div>
    <div class="col-1 box bg-info">8</div>
    <div class="col-1 box bg-dark">9</div>
    <div class="col-1 box bg-primary">10</div>
    <div class="col-1 box bg-secondary">11</div>
    <div class="col-1 box bg-success">12</div>
  </div>

  <hr class="my-4">

  <h4>4 Columns × 3 Rows (4 × 3)</h4>

  <!-- ROW 1 -->
  <div class="row">
    <div class="col-3 box bg-primary">A</div>
    <div class="col-3 box bg-success">B</div>
    <div class="col-3 box bg-danger">C</div>
    <div class="col-3 box bg-warning">D</div>
  </div>

  <!-- ROW 2 -->
  <div class="row mt-2">
    <div class="col-3 box bg-info">E</div>
    <div class="col-3 box bg-dark">F</div>
    <div class="col-3 box bg-secondary">G</div>
    <div class="col-3 box bg-primary">H</div>
  </div>

  <!-- ROW 3 -->
  <div class="row mt-2">
    <div class="col-3 box bg-success">I</div>
    <div class="col-3 box bg-danger">J</div>
    <div class="col-3 box bg-warning">K</div>
    <div class="col-3 box bg-info">L</div>
  </div>

</div>

<!-- Bootstrap JS (for interactive components if needed later) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
